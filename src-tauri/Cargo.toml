[package]
name = "kmaruda-phonebook"
version = "0.2.29"
description = "Корпоративный телефонный справочник КМАруда (Active Directory)"
authors = ["Kirill Grachev"]
repository = "https://github.com/KirillGrachev/PhoneBook"
edition = "2021"
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Managed rollout: administrative settings are compiled into the exe.
embedded-config = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Local contact cache and full-text search (FTS5 is included in the build).
# The `serialize` feature is needed for at-rest encryption: the working database lives in
# memory; only the encrypted image is written to disk (see db/encryption.rs).
rusqlite = { version = "0.41", features = ["bundled", "backup", "serialize"] }
# Cache encryption: AES-256-GCM (pure Rust, no OpenSSL/Perl/NASM).
aes-gcm = "0.10"
# Native LDAP client: PowerShell and the RSAT module are no longer needed.
ldap3 = "0.11"
# Parsing the external phone file (Yealink IPPhoneBook, XML): a streaming
# parser without building a DOM - the file is read in one pass. A separate crate
# so the fuzzer does not pull in Tauri/SQLite.
phonebook-xml = { path = "xml" }
# Native file selection dialogs (phone book XML): the plugin's Rust API
# is called from commands; no ACL permissions are required.
tauri-plugin-dialog = "2"
# Cryptographically secure random number generator (BCryptGenRandom on Windows) -
# key and nonce for local database encryption.
getrandom = "0.2"

# Bind account passwords are stored in the system secret store,
# not in config.json. The feature set depends on the platform:
# Windows -> Credential Manager, macOS -> Keychain, Linux -> kernel keyutils.
keyring = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Integrated authentication (Kerberos/NTLM of the current Windows session) via SSPI.
ldap3 = { version = "0.11", features = ["gssapi"] }
webview2-com = "0.39.1"
winreg = "0.55"
windows = { version = "0.62.2", features = [
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Limiting memory consumption during local development/CI:
# check builds do not need debug information.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0
