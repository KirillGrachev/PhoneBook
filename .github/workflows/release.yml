name: Release

# Builds the release when a v* tag is pushed (the tag must match the version
# in package.json / tauri.conf.json / Cargo.toml, checked by the version job)
# or manually through "Run workflow".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Verify the tag matches the package version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Version consistency
        run: node scripts/check-version.mjs
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

  windows:
    name: Windows installers (MSI / NSIS)
    needs: [version, sbom]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: artifacts/sbom

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # Builds the MSI and NSIS installers and attaches them to a draft GitHub Release.
      # tauri-action runs beforeBuildCommand from tauri.conf.json (npm run build).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## Install

            Normal users: use `KMAruda.PhoneBook___VERSION___x64-setup.exe`. The
            `KMAruda.PhoneBook___VERSION___x64_en-US.msi` is the MSI payload for
            enterprise deployment. The WebView2 bootstrapper is embedded in the
            installer.

            ## What changed

            See the commit list and the generated changelog for this release.
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis

      - name: Package portable, symbols and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = "v$version"
          $bundle = "src-tauri/target/release/bundle"
          $portable = "KMAruda.PhoneBook_${version}_windows-x64_portable.zip"
          $symbols = "KMAruda.PhoneBook_${version}_windows-x64_symbols.zip"
          $checksums = "SHA256SUMS-windows-x64.txt"

          Copy-Item "src-tauri/target/release/kmaruda-phonebook.exe" "KMAruda.PhoneBook.exe" -Force
          Compress-Archive -Path "KMAruda.PhoneBook.exe" -DestinationPath $portable -Force

          if (Test-Path "src-tauri/target/release/kmaruda_phonebook.pdb") {
            Copy-Item "src-tauri/target/release/kmaruda_phonebook.pdb" "KMAruda.PhoneBook.pdb" -Force
            Compress-Archive -Path "KMAruda.PhoneBook.pdb" -DestinationPath $symbols -Force
          } else {
            $symbols = $null
          }

          $files = @(
            (Join-Path $bundle "nsis/KMAruda PhoneBook_${version}_x64-setup.exe"),
            (Join-Path $bundle "msi/KMAruda PhoneBook_${version}_x64_en-US.msi"),
            (Join-Path (Get-Location) $portable)
          )
          if ($symbols) {
            $files += (Join-Path (Get-Location) $symbols)
          }
          $lines = foreach ($file in $files) {
            if (Test-Path $file) {
              $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              "$hash  $(Split-Path $file -Leaf)"
            }
          }
          $lines | Set-Content -Encoding ascii $checksums

          # Artifact smoke check: both installers must exist, and signature
          # status is recorded even while the project has no Authenticode cert.
          $required = @(
            (Join-Path $bundle "nsis/KMAruda PhoneBook_${version}_x64-setup.exe"),
            (Join-Path $bundle "msi/KMAruda PhoneBook_${version}_x64_en-US.msi"),
            (Join-Path (Get-Location) $portable)
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "missing release artifact: $file" }
            $signature = Get-AuthenticodeSignature $file
            Write-Output "artifact: $file; signature: $($signature.Status)"
          }
          if ((Get-Content $checksums).Count -lt 3) {
            throw "checksum file is incomplete: $checksums"
          }

          gh release upload $release $portable $checksums --clobber
          if ($symbols) {
            gh release upload $release $symbols --clobber
          }
          if (Test-Path "artifacts/sbom/npm.cdx.json") {
            gh release upload $release "artifacts/sbom/npm.cdx.json" --clobber
          }
          gh release edit $release --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Software bill of materials
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/sbom
          npm sbom --sbom-format cyclonedx > artifacts/sbom/npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: artifacts/sbom
          if-no-files-found: error
