name: Nightly Windows

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows nightly (build, tests, browser E2E)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Native launch smoke
        shell: pwsh
        run: |
          npm run tauri build -- --debug --no-bundle
          $exe = "src-tauri/target/debug/kmaruda-phonebook.exe"
          if (-not (Test-Path $exe)) { throw "native executable not built: $exe" }
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "native app exited during startup: $($process.ExitCode)" }
          $process.Refresh()
          if ($process.MainWindowHandle -eq 0) { throw "native app has no visible window" }
          if ($process.MainWindowTitle -notmatch 'PhoneBook') {
            throw "unexpected native window title: $($process.MainWindowTitle)"
          }
          taskkill /PID $process.Id /T /F | Out-Null
          Start-Sleep -Seconds 3

      - name: Native UI E2E (WebView2 CDP)
        run: npm run test:native

      - run: npx playwright install chromium
      - run: npm run test:e2e

  coverage:
    name: Rust coverage (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Tauri system dependencies
        timeout-minutes: 30
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
            -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} + || true
          updated=0
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20; then
              updated=1
              break
            fi
            echo "apt-get update attempt ${attempt} failed"
            sleep 5
          done
          [ "$updated" = 1 ] || exit 1
          installed=0
          for attempt in 1 2; do
            if sudo timeout 600 apt-get install -y --no-install-recommends \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Options::=--force-confold \
              libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
              libayatana-appindicator3-dev librsvg2-dev libssl-dev \
              libkeyutils-dev pkg-config build-essential; then
              installed=1
              break
            fi
            echo "apt-get install attempt ${attempt} failed"
            sudo dpkg --configure -a || true
            sleep 5
          done
          [ "$installed" = 1 ] || exit 1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --all-targets \
            --lcov --output-path coverage/lcov.info \
            --fail-under-lines 65 --fail-under-functions 58
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
