name: OSV Scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan dependency lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=./package-lock.json
        --lockfile=./src-tauri/Cargo.lock
      fail-on-vuln: true
      upload-sarif: true
    permissions:
      actions: read
      contents: read
      security-events: write
